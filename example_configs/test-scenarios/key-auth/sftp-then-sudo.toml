#:schema ../../../scenario-schema.json

# Test: SftpCopy + RemoteSudo with private key auth
# Verifies key-based authentication works with file uploads

parent = "./server.toml"

[steps.upload]
task = "upload_file"

[steps.verify]
task = "run_command"

[variables.required.local_file]
type = "Path"
label = "Local File Path"

[variables.defined]
remote_path = "/home/{username}/uploads"

[tasks.sftp_copy.upload_file]
source = "{local_file}"
destination = "{remote_path}/{basename:local_file}"
description = "Uploading file via key auth"
error_message = "Failed to upload file"

[tasks.remote_sudo.run_command]
command = "ls -la /home/test_user/uploads/"
description = "Verifying upload"
error_message = "Verification failed"
