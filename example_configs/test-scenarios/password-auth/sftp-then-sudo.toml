parent = "./server.toml"

[[steps]]
name = "upload"
task = "upload_config"

[[steps]]
name = "apply"
task = "apply_config"

[variables.required.config_file]
label = "Config File"
read_only = false
file_picker = true

[variables.defined]
remote_config_dir = "/etc/myapp"

[tasks.remote_sudo.apply_config]
command = "echo 'Configuration applied'"
description = "Applying configuration"
error_message = "Remote command failed"

[tasks.sftp_copy.upload_config]
source = "{config_file}"
destination = "{remote_config_dir}/{basename:config_file}"
description = "Uploading configuration file"
error_message = "Failed to upload configuration file"
