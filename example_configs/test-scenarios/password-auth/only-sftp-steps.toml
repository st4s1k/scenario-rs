#:schema ../../../scenario-schema.json

# Test: Only SftpCopy steps
# UI: Multiple progress bars in sequence

parent = "./server.toml"

[steps.app]
task = "upload_app"

[steps.config]
task = "upload_config"

[steps.scripts]
task = "upload_scripts"

[variables.required.app_jar]
type = "Path"
label = "Application JAR"

[variables.required.config_file]
type = "Path"
label = "Config File"

[variables.required.scripts_archive]
type = "Path"
label = "Scripts Archive"

[variables.defined]
remote_base = "/home/{username}/deploy"

[tasks.sftp_copy.upload_app]
source = "{app_jar}"
destination = "{remote_base}/{basename:app_jar}"
description = "Uploading application JAR"
error_message = "Failed to upload application"

[tasks.sftp_copy.upload_config]
source = "{config_file}"
destination = "{remote_base}/config/{basename:config_file}"
description = "Uploading configuration"
error_message = "Failed to upload config"

[tasks.sftp_copy.upload_scripts]
source = "{scripts_archive}"
destination = "{remote_base}/scripts/{basename:scripts_archive}"
description = "Uploading deployment scripts"
