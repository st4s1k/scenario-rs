#:schema ../../../scenario-schema.json

# Test: All Steps Succeed
# UI: All steps show green indicators and auto-collapse.
# Flow: SftpCopy (progress bar) → RemoteSudo (command output) → RemoteSudo (command output)

parent = "./server.toml"

[steps.upload]
task = "upload_file"

[steps.cmd_one]
task = "run_command_one"

[steps.cmd_two]
task = "run_command_two"

[variables.required.local_file]
label = "Local File Path"
file_picker = true

[variables.defined]
remote_path = "/home/{username}/uploads"

[tasks.sftp_copy.upload_file]
source = "{local_file}"
destination = "{remote_path}/{basename:local_file}"
description = "Uploading file to server"
error_message = "Failed to upload file"

[tasks.remote_sudo.run_command_one]
command = "echo 'Step 1 complete'"
description = "Running first command"
error_message = "First command failed"

[tasks.remote_sudo.run_command_two]
command = "echo 'Step 2 complete'"
description = "Running second command"
