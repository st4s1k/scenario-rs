#:schema ../../../scenario-schema.json

# Test: RemoteSudo steps with SSH agent auth
# Verifies agent-based authentication works end-to-end

parent = "./server.toml"

[[steps]]
name = "disk"
task = "check_disk"

[[steps]]
name = "memory"
task = "check_memory"

[[steps]]
name = "services"
task = "check_services"

[tasks.remote_sudo.check_disk]
command = "df -h"
description = "Checking disk usage"
error_message = "Disk check failed"

[tasks.remote_sudo.check_memory]
command = "free -m"
description = "Checking memory usage"
error_message = "Memory check failed"

[tasks.remote_sudo.check_services]
command = "ps aux | head -10"
description = "Checking running services"
error_message = "Service check failed"
