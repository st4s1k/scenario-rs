name: "publish"

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install frontend dependencies
        run: npm install
        working-directory: ./gui

      - name: Run Angular tests
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage
        working-directory: ./gui

      - name: Run Rust tests
        run: cargo test --workspace

  publish-tauri:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: ""
          - platform: "ubuntu-latest"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install
        working-directory: ./gui

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./gui
          appName: scenario-rs-gui
          tagName: v__VERSION__
          releaseName: "scenario-rs v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-cli-tui:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
            archive: tar.gz
          - platform: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
            archive: tar.gz
          - platform: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
            archive: tar.gz
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
            archive: zip

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: build CLI and TUI
        run: |
          cargo build --release --target ${{ matrix.target }} -p scenario-rs-cli -p scenario-rs-tui

      - name: package binaries (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../scenario-rs-cli-${{ matrix.target }}.tar.gz scenario-rs-cli${{ matrix.suffix }}
          tar czf ../../../scenario-rs-tui-${{ matrix.target }}.tar.gz scenario-rs-tui${{ matrix.suffix }}

      - name: package binaries (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/scenario-rs-cli${{ matrix.suffix }}" -DestinationPath "scenario-rs-cli-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/scenario-rs-tui${{ matrix.suffix }}" -DestinationPath "scenario-rs-tui-${{ matrix.target }}.zip"

      - name: upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            scenario-rs-cli-${{ matrix.target }}.${{ matrix.archive }}
            scenario-rs-tui-${{ matrix.target }}.${{ matrix.archive }}
