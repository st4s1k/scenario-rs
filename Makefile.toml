[env]
GUI_DIR = "gui"

# --- Rust workspace ---

[tasks.check]
description = "Run cargo check on the workspace"
command = "cargo"
args = ["check"]

[tasks.build]
description = "Build the workspace (debug)"
command = "cargo"
args = ["build"]

[tasks.build-release]
description = "Build the workspace (release)"
command = "cargo"
args = ["build", "--release"]

[tasks.test]
description = "Run all Rust tests"
command = "cargo"
args = ["test"]

[tasks.ng-test]
workspace = false
description = "Run Angular unit tests"
dependencies = ["npm-install"]
cwd = "${GUI_DIR}"
script_runner = "@shell"
script = ["npx ng test --watch=false"]

[tasks.test-all]
workspace = false
description = "Run all tests (Rust + Angular)"
dependencies = ["test", "ng-test"]

# --- Frontend ---

[tasks.npm-install]
workspace = false
description = "Install frontend dependencies"
cwd = "${GUI_DIR}"
script_runner = "@shell"
script = ["npm install"]

[tasks.ng-build]
workspace = false
description = "Build Angular frontend"
dependencies = ["npm-install"]
cwd = "${GUI_DIR}"
script_runner = "@shell"
script = ["npm run build"]

# --- Tauri ---

[tasks.tauri-dev]
workspace = false
description = "Run GUI in development mode"
dependencies = ["npm-install"]
cwd = "${GUI_DIR}"
script_runner = "@shell"
script = ["npm run tauri dev"]

[tasks.tauri-build]
workspace = false
description = "Build GUI (release)"
dependencies = ["npm-install"]
cwd = "${GUI_DIR}"
script_runner = "@shell"
script = ["npm run tauri build"]

[tasks.tauri-build-debug]
workspace = false
description = "Build GUI (debug)"
dependencies = ["npm-install"]
cwd = "${GUI_DIR}"
script_runner = "@shell"
script = ["npm run tauri build -- --debug"]

# --- Composite ---

[tasks.build-all]
workspace = false
description = "Build everything (Rust workspace + GUI debug)"
dependencies = ["build", "tauri-build-debug"]

[tasks.build-all-release]
workspace = false
description = "Build everything (Rust workspace + GUI release)"
dependencies = ["build-release", "tauri-build"]

[tasks.verify]
workspace = false
description = "Full verification: check + all tests + Angular build"
dependencies = ["check", "test-all", "ng-build"]

# --- Coverage ---

[tasks.coverage]
workspace = false
description = "Generate HTML coverage report (requires cargo-tarpaulin)"
command = "cargo"
args = ["tarpaulin", "--workspace", "--out", "html", "--skip-clean"]

[tasks.coverage-lcov]
workspace = false
description = "Generate LCOV coverage report for CI (requires cargo-tarpaulin)"
command = "cargo"
args = ["tarpaulin", "--workspace", "--out", "lcov", "--output-dir", "coverage", "--skip-clean"]
